[project]
name = "opes-validation"
version = "0.1.0"
description = "Validation of PLUMED OPES_METAD and OPES_METAD_EXPLORE against the systems of the original papers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "scipy",
]

[project.scripts]
opesval = "opesval.__main__:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "opesval"
module-root = ""
